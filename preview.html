<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DISH Platform Preview</title><style>body{margin:0;background:#f5f6f3;color:#10221b;font:14px Arial,sans-serif}header{height:68px;background:#fff;border-bottom:1px solid #dde3df;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.brand{font-weight:800;letter-spacing:.18em}.tabs{display:flex;gap:6px}.tabs button{border:1px solid #dde3df;background:#fff;border-radius:9px;padding:9px 13px;font-weight:700}.tabs button.active{background:#0e5b46;color:#fff}.hero{background:#10251e;color:#fff;padding:72px 6vw;min-height:270px}.ey{font-size:10px;letter-spacing:.18em;color:#d4bd82;font-weight:800}.hero h1{font:clamp(44px,7vw,84px)/.95 Georgia,serif;max-width:900px;margin:16px 0}.hero p{max-width:650px;color:#c9d7d1;line-height:1.7}.wrap{max-width:1300px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}.card{background:#fff;border:1px solid #dde3df;border-radius:16px;padding:20px;box-shadow:0 16px 45px #132a2110}.label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#66736d}.value{font-size:28px;font-weight:800;margin:9px 0}.status{display:inline-block;background:#e8f3ee;color:#21634e;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:800}.danger{background:#fae8e6;color:#a33e37}.warn{background:#fff1d9;color:#9a6817}.row{display:grid;grid-template-columns:1.3fr 1fr 1fr .8fr;padding:14px;border-bottom:1px solid #edf0ee;gap:12px;font-size:12px}.head{font-size:9px;color:#66736d;text-transform:uppercase}.timeline{display:flex;margin-top:20px}.step{flex:1;text-align:center;font-size:10px;color:#66736d;position:relative;padding-top:24px}.dot{position:absolute;top:0;left:50%;margin-left:-7px;width:14px;height:14px;border-radius:50%;background:#0e5b46;box-shadow:0 0 0 4px #f5f6f3}.footer{background:#10251e;color:#b8c8c0;padding:35px 6vw;margin-top:40px}@media(max-width:800px){.grid,.grid2{grid-template-columns:1fr 1fr}.row{min-width:650px}.table{overflow:auto}}@media(max-width:520px){.grid,.grid2{grid-template-columns:1fr}.hero{padding:55px 20px}.wrap{padding:18px}header{padding:0 15px}.tabs button{padding:7px 9px;font-size:11px}}</style></head><body><header><div class="brand">◇ DISH</div><div class="tabs"><button class="active" onclick="show('public',this)">Public</button><button onclick="show('admin',this)">Admin</button><button onclick="show('agent',this)">Agent</button><button onclick="show('user',this)">User</button></div></header><div id="app"></div><footer class="footer">DISH · Fractional Real Estate Investment · Policy-Based · LIC-Grade Operations</footer><script>const sets={admin:['Active policies|4,812|+8.4%','Premium collected|₹18.4Cr|+12.1%','12-mo yield liability|₹7.6Cr|Forecast','Open SLA tickets|38|-11%'],agent:['Policies sold|48|YTD','Active policies|41|+4','Commission YTD|₹2.4L|+18%','Lapsed — action|7|Urgent'],user:['Monthly EMI|₹10,000|Next 25 May','Total invested|₹1.80L|18 / 36','Yield starts|Month 37|18 months left','Benefits received|₹0|Awaiting start']};function cards(a){return '<div class="grid">'+a.map(x=>{let y=x.split('|');return '<div class="card"><div class="label">'+y[0]+'</div><div class="value">'+y[1]+'</div><span class="status '+(y[2]=='Urgent'?'danger':'')+'">'+y[2]+'</span></div>'}).join('')+'</div>'}function portal(role){let title=role=='admin'?'Master Control':role=='agent'?'Field Sales Workspace':'Policyholder Self-Service';return '<div class="wrap"><div class="ey">DISH / '+role+'</div><h2 style="font:32px Georgia,serif">'+title+'</h2>'+cards(sets[role])+'<div class="grid2"><div class="card"><div class="label">Lifecycle health</div><h3>Policy state machine</h3><div class="timeline">'+['Proposal','KYC','EMI Running','Benefit','Maturity'].map(x=>'<div class="step"><span class="dot"></span>'+x+'</div>').join('')+'</div></div><div class="card"><div class="label">Priority queue</div><h3>Operational actions</h3><p>3 consecutive EMI failures <span class="status danger">Urgent</span></p><p>7 SLA tickets nearing breach <span class="status warn">Review</span></p><p>12 reprint requests <span class="status warn">Review</span></p></div></div><div class="card" style="margin-top:14px"><div class="label">Recent activity</div><h3>Policy registry</h3><div style="overflow:auto"><div class="row head"><span>Policy</span><span>Client</span><span>EMI</span><span>Status</span></div>'+['IREC-2024-00841|Rahul Mehta|₹10,000|EMI Running','IREC-2024-00838|Priya Shah|₹15,000|Benefit Active','IREC-2024-00831|Aman Verma|₹8,000|KYC Pending','IREC-2024-00812|Neha Jain|₹25,000|Lapsed'].map(x=>{let y=x.split('|');return '<div class="row"><span>'+y[0]+'</span><span>'+y[1]+'</span><span>'+y[2]+'</span><span class="status '+(y[3]=='Lapsed'?'danger':y[3]=='KYC Pending'?'warn':'')+'">'+y[3]+'</span></div>'}).join('')+'</div></div></div>'}function show(role,btn){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');if(role==='public'){document.getElementById('app').innerHTML='<section class="hero"><div class="ey">Fractional Real Estate · Policy Based</div><h1>Own a stake in tomorrow’s real estate.</h1><p>A premium policy-led experience with live EMI calculation, transparent lifecycle states and institutional-grade operations.</p></section><div class="wrap"><div class="card" style="margin-top:-65px;position:relative"><div class="label">Live policy calculator</div><h2 style="font-size:36px">₹10,000 / month · 36 months</h2><div class="grid">'+['Total corpus|₹3,60,000|Calculated','Year 1 yield|₹3,600/mo|12% p.a.','Yield starts|Month 37|After EMI','GST|₹1,800/mo|18%'].map(x=>{let y=x.split('|');return '<div class="card"><div class="label">'+y[0]+'</div><div class="value">'+y[1]+'</div><span class="status">'+y[2]+'</span></div>'}).join('')+'</div></div></div>'}else document.getElementById('app').innerHTML=portal(role)}show('public',document.querySelector('.tabs button'));</script></body></html>
